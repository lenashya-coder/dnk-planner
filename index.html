<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<title>ДНК ФАКТОРИ · план</title>
<style>
:root{
  --bg:#F5F1EA; --bg-2:#ECE5D9; --surface:#FFFFFF; --surface-2:#F8F5EF; --line:#EDE7DD; --line-2:#E3DBCE;
  --ink:#0F1830; --muted:#6A6E7E; --faint:#A5A6AF;
  --blue:#2A5BE0; --blue-ink:#FFFFFF; --blue-soft:#E5ECFC; --blue-tint:#F3F6FE;
  --grad:linear-gradient(172deg,#2C5FE4 0%,#5C86EE 55%,#A6BEF6 100%);
  --sand:#B5824A; --sand-soft:#F2E6D4;
  --bad:#C8453B; --ok:#2F7D55;
  --shadow:0 1px 2px rgba(15,24,48,.04),0 12px 32px -18px rgba(15,24,48,.18);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1222; --bg-2:#141A2E; --surface:#161D33; --surface-2:#1C243C; --line:#252E49; --line-2:#2E3858;
    --ink:#F2ECE1; --muted:#A6ABBF; --faint:#6E7592;
    --blue:#7FA0FF; --blue-ink:#0D1222; --blue-soft:#22305E; --blue-tint:#1A2447;
    --grad:linear-gradient(172deg,#2449B8 0%,#3A62CF 55%,#5C80DC 100%);
    --sand:#DDB27A; --sand-soft:#382D20; --bad:#F08A80; --ok:#7ACB9A;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1222; --bg-2:#141A2E; --surface:#161D33; --surface-2:#1C243C; --line:#252E49; --line-2:#2E3858;
  --ink:#F2ECE1; --muted:#A6ABBF; --faint:#6E7592;
  --blue:#7FA0FF; --blue-ink:#0D1222; --blue-soft:#22305E; --blue-tint:#1A2447;
  --grad:linear-gradient(172deg,#2449B8 0%,#3A62CF 55%,#5C80DC 100%);
  --sand:#DDB27A; --sand-soft:#382D20; --bad:#F08A80; --ok:#7ACB9A;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.wrap{max-width:1320px;margin:0 auto;padding-inline:clamp(16px,4vw,40px);padding-block:28px 72px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.hello{display:flex;flex-direction:column;gap:6px;padding-top:10px}
.hello .greet{font-size:18px;color:var(--muted)}
.hello .brand{font-size:13px;color:var(--faint);letter-spacing:.02em}
.hello .brand b{color:var(--ink);font-weight:600}
.clock{display:flex;align-items:center;gap:16px}
.clock .tz{text-align:right;font-size:13px;color:var(--muted);line-height:1.35}
.clock .tz .save{color:var(--faint);font-size:12px}
.clock .time{font-family:var(--display);font-size:clamp(52px,8vw,88px);font-weight:500;letter-spacing:-.04em;line-height:.9;font-variant-numeric:tabular-nums}

.syncwarn{background:var(--sand-soft);color:var(--ink);border-radius:18px;padding:14px 18px;font-size:14px;line-height:1.5}
.syncwarn b{display:block;margin-bottom:2px}

/* view-only mode */
body.ro #addForDay, body.ro #addEntry, body.ro #addTaskForm, body.ro .col.mine, body.ro .beacon .acts,
body.ro #mDelete, body.ro #entryForm button[type=submit], body.ro .slot-item .link, body.ro .edit-only{display:none!important}
body.ro .chk, body.ro #sched button, body.ro select.status, body.ro .lrow .days{pointer-events:none}
body.ro .lrow .days{border-bottom-color:transparent}
.rotag{display:inline-block;margin-left:8px;font-size:12px;color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:2px 10px;vertical-align:middle}

/* generic */
.card{background:var(--surface);border-radius:26px;box-shadow:var(--shadow)}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.sec-title{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.sec-title h2{font-size:clamp(28px,4vw,40px);font-weight:600;letter-spacing:-.035em;line-height:1}
.sec-title .sub{color:var(--muted);font-size:17px}
.navline{display:flex;align-items:center;gap:6px;color:var(--ink)}
.navline .lbl{font-size:17px;min-width:150px;text-align:center}
.arrow{border:none;background:none;width:30px;height:30px;border-radius:50%;color:var(--muted);font-size:18px;display:grid;place-items:center}
.arrow:hover{background:var(--bg-2);color:var(--ink)}
.link{border:none;background:none;color:var(--blue);font-size:14px;font-weight:500;padding:4px 6px;border-radius:8px}
.link:hover{background:var(--blue-soft)}
.btn{border:none;background:var(--surface-2);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:500;transition:background .15s,transform .1s}
.btn:hover{background:var(--bg-2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--blue);color:var(--blue-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.icon{width:36px;height:36px;padding:0;display:grid;place-items:center}
.btn.dashed{background:transparent;border:1.5px dashed var(--line-2);color:var(--muted)}
.btn.dashed:hover{border-color:var(--blue);color:var(--blue)}
.btn.outline{background:transparent;border:1px solid var(--line-2);font-weight:400;padding:9px 20px}
.btn.outline:hover{border-color:var(--blue);color:var(--blue)}
.btn.danger{color:var(--bad);background:transparent}
.btn.danger.armed{background:var(--bad);color:#fff}
.stats{display:flex;gap:22px;color:var(--muted);font-size:16px;align-items:center;flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:700;margin-left:4px}

/* calendar */
.calcard{overflow:hidden}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .dow{font-size:13px;color:var(--muted);padding:16px 14px 12px;border-bottom:1px solid var(--line)}
.cal .dow:not(:nth-child(7n)){border-right:1px solid var(--line)}
.day{position:relative;min-height:112px;border:none;background:transparent;padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer;min-width:0;border-bottom:1px solid var(--line);transition:background .15s}
.day:not(:nth-child(7n)){border-right:1px solid var(--line)}
.day:hover{background:var(--surface-2)}
.day .n{display:flex;justify-content:flex-end;font-family:var(--display);font-size:26px;font-weight:300;letter-spacing:-.03em;color:var(--muted);line-height:1;margin-bottom:4px}
.day.other .n,.day.other .chip{opacity:.35}
.day.past:not(.today) .n{color:var(--faint)}
.day.today{background:var(--blue-tint)}
.day.today::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--blue)}
.day.today .n{color:var(--ink);font-weight:600}
.day.today .n::before{content:"сегодня";font-family:var(--font);font-size:12px;font-weight:500;letter-spacing:0;color:var(--blue);margin-right:auto;align-self:center}
.day.sel{box-shadow:inset 0 0 0 2px var(--blue)}
.chip{font-size:12px;line-height:1.3;border-radius:7px;padding:3px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.chip.post{background:var(--blue);color:var(--blue-ink)}
.chip.story{background:var(--sand-soft);color:var(--sand)}
.chip.both{background:var(--blue-soft);color:var(--blue)}
.chip.done{opacity:.4;text-decoration:line-through}
.chip.slot{background:transparent;border:1px dashed var(--line-2);color:var(--faint);font-weight:400}
.more{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:18px;flex-wrap:wrap;padding:14px 16px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:4px;display:inline-block}
@media (max-width:640px){
  .day{min-height:64px;padding:6px}
  .day .n{font-size:17px}
  .day.today .n::before{display:none}
  .chip{font-size:0;padding:0;height:5px;border-radius:3px}
  .more{display:none}
  .cal .dow{padding:10px 6px;font-size:11px;text-align:center}
}

/* today board */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;align-items:start}
.col{border-radius:26px;padding:22px 22px 24px;display:flex;flex-direction:column;gap:14px;min-height:300px;background:var(--surface);box-shadow:var(--shadow)}
.col-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.col-head h3{font-size:18px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.col-head .cnt{color:var(--muted);font-size:16px;font-variant-numeric:tabular-nums}
.col.main{background:var(--grad);color:#fff;box-shadow:0 18px 40px -20px rgba(42,91,224,.55)}
.col.main .col-head .cnt{color:rgba(255,255,255,.8)}
.col .foot{margin-top:auto;font-size:13px;color:var(--muted);line-height:1.5}
.col.main .foot{color:rgba(255,255,255,.78)}
.ico{width:10px;height:10px;border-radius:50%;display:inline-block}
.items{display:flex;flex-direction:column;gap:12px}
.item{display:flex;gap:12px;align-items:flex-start}
.item .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .tt{font-size:16px;line-height:1.35;cursor:pointer}
.item .ts{font-size:13px;color:var(--muted)}
.col.main .item .ts{color:rgba(255,255,255,.75)}
.item.done .tt{text-decoration:line-through;opacity:.55}
.item .acts{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.item:hover .acts,.item:focus-within .acts{opacity:1}
@media (hover:none){.item .acts{opacity:1}}
.mini{border:none;background:none;color:var(--faint);font-size:13px;padding:2px 5px;border-radius:6px}
.mini:hover{color:var(--ink);background:var(--surface-2)}
.col.main .mini{color:rgba(255,255,255,.8)}
.col.main .mini:hover{background:rgba(255,255,255,.15);color:#fff}
.chk{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--faint);flex:none;margin:0;display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.chk::after{content:"";width:6px;height:11px;border:solid transparent;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.chk:checked{background:var(--blue);border-color:var(--blue)}
.chk:checked::after{border-color:var(--blue-ink)}
.col.main .chk{border-color:rgba(255,255,255,.85)}
.col.main .chk:checked{background:#fff;border-color:#fff}
.col.main .chk:checked::after{border-color:#2A5BE0}
.addrow{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:16px;border:none;background:none;padding:0;text-align:left}
.addrow .plus{width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:15px;line-height:1;flex:none}
.addrow:hover{color:var(--blue)}
.addrow input{border:none;background:transparent;font-size:16px;flex:1;min-width:0;padding:0;outline:none;color:var(--ink)}
.addrow input::placeholder{color:var(--faint)}
.slot-item{display:flex;align-items:center;gap:12px}
.slot-item .ring{width:24px;height:24px;border-radius:50%;border:1.5px dashed var(--line-2);flex:none}
.slot-item .t{flex:1;font-size:16px}
.slot-item .t small{display:block;font-size:13px;color:var(--muted)}
.muted{color:var(--muted);font-size:14px}

/* beacon */
.beacon{border:2px solid var(--blue-soft);border-radius:24px;padding:18px 22px;display:flex;align-items:center;gap:14px 32px;flex-wrap:wrap}
.beacon.warn{border-color:var(--sand)}
.beacon.bad{border-color:var(--blue)}
.beacon .rows{display:flex;gap:10px 48px;flex-wrap:wrap;flex:1;min-width:260px}
.lrow{display:flex;align-items:baseline;gap:14px}
.lrow .dot{width:10px;height:10px;border-radius:50%;flex:none;align-self:center;background:var(--faint);opacity:.45}
.lrow .lab{color:var(--muted);font-size:16px}
.lrow .val{position:relative}
.lrow .days{border:none;background:none;padding:0;font-size:16px;font-weight:500;color:var(--ink);border-bottom:1.5px dotted currentColor;line-height:1.25;white-space:nowrap}
.lrow.bad .dot{background:var(--blue);opacity:1}
.lrow.bad .days{color:var(--blue)}
.lrow.warn .dot{background:var(--sand);opacity:1}
.lrow.warn .days{color:var(--sand)}
.lrow.ok .dot{background:var(--blue);opacity:.35}
.lrow input[type=date]{position:absolute;right:0;top:100%;opacity:0;width:1px;height:1px;pointer-events:none}
.lrow input[type=date].show{opacity:1;width:auto;height:auto;pointer-events:auto;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--surface);z-index:3}
.beacon .acts{display:flex;gap:8px;flex-wrap:wrap}
.beacon .tag{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;width:100%;margin-bottom:-6px}
.tag-soon{font-size:11px;color:var(--faint);text-transform:none;letter-spacing:0;display:inline-block;margin-left:6px}

/* plan table */
.seg{display:inline-flex;background:var(--bg-2);border-radius:999px;padding:3px}
.seg button{border:none;background:transparent;padding:6px 14px;font-size:14px;color:var(--muted);border-radius:999px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(15,24,48,.1)}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tablewrap{overflow-x:auto;border-radius:26px}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:820px}
th{font-size:13px;color:var(--muted);text-align:left;font-weight:400;padding:16px 14px 12px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0}
th .n{color:var(--faint);margin-right:6px;font-variant-numeric:tabular-nums}
td{padding:14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px;background:var(--surface);cursor:pointer}
tr:last-child td{border-bottom:none}
td:hover{background:var(--blue-tint)}
th:not(:last-child),td:not(:last-child){border-right:1px solid var(--line)}
th:first-child,td:first-child{position:sticky;left:0;z-index:1}
th:first-child{z-index:2}
.cell{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
.cell.nil{color:var(--faint)}
.cell .why{display:block;color:var(--muted);margin-top:6px}
.dcell{display:flex;flex-direction:column;align-items:flex-start;white-space:nowrap}
.dcell b{font-family:var(--display);font-size:24px;font-weight:300;letter-spacing:-.03em;line-height:1}
.dcell small{color:var(--muted);font-size:12px;margin-top:3px}
.type{display:inline-block;font-size:12px;font-weight:500;border-radius:999px;padding:3px 10px;white-space:nowrap}
.type.post{background:var(--blue);color:var(--blue-ink)}
.type.story{background:var(--sand-soft);color:var(--sand)}
.type.both{background:var(--blue-soft);color:var(--blue)}
select.status{border:none;border-radius:999px;background:var(--surface-2);padding:5px 10px;font-size:13px}
select.status[data-s="Опубликовано"]{background:var(--blue);color:var(--blue-ink)}
select.status[data-s="Готово"]{background:var(--blue-soft);color:var(--blue)}
select.status[data-s="В работе"]{background:var(--sand-soft);color:var(--sand)}
.empty{color:var(--muted);font-size:15px;padding:22px}

/* schedule */
.schedcard{padding:24px}
.sched{display:flex;flex-direction:column;gap:14px}
.sched .line{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.sched .lab{width:80px;font-size:16px}
.dows{display:flex;gap:8px;flex-wrap:wrap}
.dows button{width:64px;height:64px;border-radius:18px;border:1px solid var(--line);background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:8px 10px;line-height:1;transition:background .15s}
.dows button b{font-size:12px;font-weight:500}
.dows button small{font-family:var(--display);font-size:22px;font-weight:300;letter-spacing:-.03em;align-self:flex-end}
.dows button:hover{background:var(--surface-2)}
.dows button.today{border-color:var(--ink)}
.dows button.on.p{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.dows button.on.q{background:var(--blue-soft);border-color:var(--blue-soft);color:var(--blue)}
.dows button.on.s{background:var(--sand-soft);border-color:var(--sand-soft);color:var(--sand)}
.note{font-size:14px;color:var(--muted)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(13,18,34,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow-y:auto;z-index:20}
.modal{background:var(--surface);border-radius:28px;width:100%;max-width:760px;box-shadow:0 40px 90px rgba(0,0,0,.28)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:22px 26px 10px}
.modal-head h2{font-size:26px;font-weight:600;letter-spacing:-.03em}
.modal-body{padding:8px 26px 18px;display:flex;flex-direction:column}
.modal-foot{display:flex;justify-content:space-between;gap:10px;padding:14px 26px 24px;flex-wrap:wrap}
.fld{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
.fld:last-child{border-bottom:none}
.fld .no{font-family:var(--display);font-size:22px;font-weight:300;color:var(--faint);letter-spacing:-.03em;line-height:1.2}
.fld .body{display:flex;flex-direction:column;gap:8px;min-width:0}
.fld .lab{font-size:15px;font-weight:600}
.fld .lab .hint{font-weight:400;color:var(--faint)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:15px;color:var(--ink);width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--blue);outline:none;background:var(--surface)}
.fld textarea{resize:vertical;min-height:76px;line-height:1.45}
.fld textarea.tall{min-height:120px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.sub-lab{font-size:13px;color:var(--muted)}
.charcount{font-size:12px;color:var(--faint);text-align:right}

/* category picker & modal fields */
.catpick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--bg-2);border-radius:18px;padding:5px;margin-bottom:18px}
.catpick button{border:none;background:transparent;border-radius:14px;padding:12px 6px;font-size:16px;font-weight:500;color:var(--muted);transition:background .15s,color .15s}
.catpick button:hover{color:var(--ink)}
.catpick button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(15,24,48,.12)}
.catpick button[aria-checked="true"][data-cat="Пост"]{background:var(--blue);color:var(--blue-ink)}
.catpick button[aria-checked="true"][data-cat="Сторис"]{background:var(--sand-soft);color:var(--sand)}
.catpick button[aria-checked="true"][data-cat="Reels"]{background:var(--ink);color:var(--bg)}
.catpick button[aria-checked="true"][data-cat="Опрос"]{background:var(--blue-soft);color:var(--blue)}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.group{display:flex;flex-direction:column;gap:16px;padding-top:18px}
.mf{display:flex;flex-direction:column;gap:7px;min-width:0}
.mf>span{font-size:15px;font-weight:600}
.mf>span em{font-style:normal;font-weight:400;color:var(--faint);margin-left:6px}
.mf input,.mf select,.mf textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:15px;color:var(--ink);width:100%}
.mf input:focus,.mf select:focus,.mf textarea:focus{border-color:var(--blue);outline:none;background:var(--surface)}
.mf textarea{resize:vertical;min-height:84px;line-height:1.45}
.mf textarea.tall{min-height:130px}
.mf.story-n textarea{min-height:64px}
.chip.reels,.type.reels{background:var(--ink);color:var(--bg)}
.chip.poll,.type.poll{background:var(--blue-soft);color:var(--blue)}
.content{display:flex;flex-direction:column;gap:8px;max-width:560px}
.content .cf{display:grid;grid-template-columns:130px 1fr;gap:10px}
.content .cl{color:var(--faint);font-size:13px}
.content .cv{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:640px){.content .cf{grid-template-columns:1fr;gap:2px}}

/* hover card */
.hov{position:fixed;z-index:15;width:340px;max-width:calc(100vw - 16px);max-height:70vh;overflow:auto;background:var(--surface);border-radius:20px;box-shadow:0 24px 60px rgba(15,24,48,.22);padding:16px 18px;display:flex;flex-direction:column;gap:14px;pointer-events:none}
.he{display:flex;flex-direction:column;gap:9px}
.he+.he{border-top:1px solid var(--line);padding-top:12px}
.hh{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.hl{font-size:12px;color:var(--faint)}
.ht{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:30}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
